# ============================================
# WhatsApp Bot Platform — Production Compose
# Hardened: internal network, non-root, resource
# limits, Nginx reverse proxy, no public backend
# ============================================
version: "3.8"

services:
  # ---- Backend + WhatsApp Worker ----
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-bot:1.1.5
    restart: unless-stopped
    # NO ports: exposed — only accessible via internal network through nginx
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Set to your public domain (used for CORS)
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    volumes:
      # Persist WhatsApp session (survives restarts, no QR re-scan)
      - baileys_auth:/app/auth_info
      # Persist JSON data files (knowledge base, config, alerts, etc.)
      - bot_data:/app/data
      # Firebase service account key (read-only mount)
      - ./orquestapuntacana-firebase-adminsdk-fbsvc-1adc55a0b0.json:/app/orquestapuntacana-firebase-adminsdk-fbsvc-1adc55a0b0.json:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # ONLY nginx is exposed to the internet
      - "80:80"
      - "443:443"
    volumes:
      # Use no-ssl config initially, switch to default.conf after certbot
      - ./nginx/default.no-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL certificates (managed by certbot)
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      whatsapp-bot:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ---- Certbot (SSL certificate manager) ----
  # Run manually: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: []
    profiles:
      - ssl-setup

# ---- Networks ----
networks:
  internal:
    driver: bridge
    # Backend is ONLY reachable within this network
    internal: false  # nginx needs internet access for inbound traffic

# ---- Volumes ----
volumes:
  baileys_auth:
    driver: local
  bot_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local
