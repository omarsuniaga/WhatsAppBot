# =============================================================================
# Docker Compose - Producción con Nginx Reverse Proxy
# =============================================================================
# Uso: docker compose -f docker-compose.production.yml up -d

services:
  app:
    build: .
    container_name: whatsapp-bot-api
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - ./web-bot_sessions:/app/web-bot_sessions
      - ./data:/app/data
      - ./backend/data:/app/backend/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: whatsapp-bot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
